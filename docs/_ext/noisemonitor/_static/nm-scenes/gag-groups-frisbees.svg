<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000"><style>
.anim{transform-box:view-box}
.popf{animation:popf 2.4s ease-out infinite 0s;transform-origin:900px 200px}@keyframes popf{0%,30%{transform:scale(0);opacity:0}40%{transform:scale(1.15);opacity:1}50%,85%{transform:scale(1);opacity:1}100%{opacity:0}}</style><g stroke="#1e293b" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"><g><animateMotion path="M -150 500 Q 800 100 1750 450" dur="3.5s" begin="0s" repeatCount="indefinite" rotate="0" /><g><ellipse rx="50" ry="16" fill="#ef4444"/><ellipse rx="30" ry="8" fill="#fff" fill-opacity="0.5" stroke="none"/><animateTransform attributeName="transform" type="rotate" values="-18 0 0;18 0 0;-18 0 0" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" dur="0.5s" begin="0s" repeatCount="indefinite" additive="sum"/></g></g><g><animateMotion path="M 1750 360 Q 800 520 -150 200" dur="4.2s" begin="-1.6s" repeatCount="indefinite" rotate="0" /><g><ellipse rx="50" ry="16" fill="#22c55e"/><ellipse rx="30" ry="8" fill="#fff" fill-opacity="0.5" stroke="none"/><animateTransform attributeName="transform" type="rotate" values="-18 0 0;18 0 0;-18 0 0" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" dur="0.5s" begin="0s" repeatCount="indefinite" additive="sum"/></g></g><g><animateMotion path="M -150 260 Q 800 -40 1750 340" dur="4.8s" begin="-3s" repeatCount="indefinite" rotate="0" /><g><ellipse rx="50" ry="16" fill="#a855f7"/><ellipse rx="30" ry="8" fill="#fff" fill-opacity="0.5" stroke="none"/><animateTransform attributeName="transform" type="rotate" values="-18 0 0;18 0 0;-18 0 0" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" dur="0.5s" begin="0s" repeatCount="indefinite" additive="sum"/></g></g><g class="anim popf"><g transform="translate(900 200) rotate(-6) scale(0.55)"></g></g></g></svg>