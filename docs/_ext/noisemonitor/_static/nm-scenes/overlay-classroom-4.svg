<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000"><style>
.anim{transform-box:view-box}

    .goat{animation:hop 1.1s ease-in-out infinite;transform-origin:250px 995px}
    @keyframes hop{0%,60%,100%{transform:translateY(0)}75%{transform:translateY(-34px) rotate(-3deg)}}
    .popg{animation:popg 2.2s ease-out infinite;transform-origin:560px 560px}
    @keyframes popg{0%,30%{transform:scale(0);opacity:0}42%{transform:scale(1.15);opacity:1}55%,85%{transform:scale(1);opacity:1}100%{transform:scale(1);opacity:0}}
    .spot{animation:drift 3.6s ease-in-out infinite alternate}
    .s1{animation-name:drift2;animation-duration:4.2s}.s2{animation-name:drift3;animation-duration:3s}.s3{animation-duration:5s}
    @keyframes drift{from{transform:translate(-90px,30px)}to{transform:translate(120px,-50px)}}
    @keyframes drift2{from{transform:translate(80px,60px)}to{transform:translate(-130px,-30px)}}
    @keyframes drift3{from{transform:translate(0,-80px)}to{transform:translate(40px,90px)}}
    .f1{animation:twinkle 0.9s steps(2) infinite}.f2{animation:twinkle 1.3s steps(2) infinite .3s}.f3{animation:twinkle 0.7s steps(2) infinite .5s}
