      <path d="M-28 200 Q0 320 28 200 Z" fill="#fde047" stroke="none"/>
    </g>
    <!-- fins -->
    <path d="M-70 80 L-140 200 L-70 180 Z" fill="#ef4444"/>
    <path d="M70 80 L140 200 L70 180 Z" fill="#ef4444"/>
