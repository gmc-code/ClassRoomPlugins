<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000"><style>
.anim{transform-box:view-box}
.puff{animation:puff 1.2s ease-in-out infinite alternate}@keyframes puff{from{transform:scale(.85)}to{transform:scale(1.15)}}.rflame{animation:rflame .12s steps(2) infinite;transform-origin:800px 810px}@keyframes rflame{50%{transform:scaleY(1.3)}}.popl{animation:popl 6s ease-out infinite -3.5s;transform-origin:1200px 300px}@keyframes popl{0%,30%{transform:scale(0);opacity:0}40%{transform:scale(1.15);opacity:1}50%,85%{transform:scale(1);opacity:1}100%{opacity:0}}</style><g stroke="#1e293b" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"><rect x="640" y="900" width="320" height="30" rx="6" fill="#475569"/><rect x="660" y="830" width="20" height="70" fill="#94a3b8"/><rect x="920" y="830" width="20" height="70" fill="#94a3b8"/><g><g transform="translate(800 620) scale(0.95)">
