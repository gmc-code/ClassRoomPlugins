<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000"><style>
.anim{transform-box:view-box}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}

    .flash{animation:flash 0.8s steps(1) infinite}
    .blue{animation-delay:.4s}
    @keyframes flash{0%{opacity:1}50%{opacity:0}}
    .band{animation:wob 0.9s ease-in-out infinite alternate}
    .b1{animation-duration:.7s}.b2{animation-duration:1.1s}
    @keyframes wob{from{transform:translateX(-30px)}to{transform:translateX(30px)}}
    .pop{animation:none}
