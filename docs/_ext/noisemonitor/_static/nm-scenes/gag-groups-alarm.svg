<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000"><style>
.anim{transform-box:view-box}

    .flash{animation:flash 0.8s steps(1) infinite}
    .blue{animation-delay:.4s}
    @keyframes flash{0%{opacity:1}50%{opacity:0}}</style><defs>
    <radialGradient id="redglow" cx="50%" cy="50%" r="75%">
      <stop offset="55%" stop-color="#ef4444" stop-opacity="0"/><stop offset="100%" stop-color="#ef4444" stop-opacity="0.85"/></radialGradient>
    <radialGradient id="blueglow" cx="50%" cy="50%" r="75%">
      <stop offset="55%" stop-color="#3b82f6" stop-opacity="0"/><stop offset="100%" stop-color="#3b82f6" stop-opacity="0.8"/></radialGradient></defs><g stroke="#1e293b" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <rect class="anim flash" width="1600" height="1000" fill="url(#redglow)" stroke="none"/>
    <rect class="anim flash blue" width="1600" height="1000" fill="url(#blueglow)" stroke="none"/>
    
        <g transform="translate(90 70)">
          <g><polygon points="0,0 360,-80 360,80" fill="#ef4444" fill-opacity="0.28" stroke="none"/><animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1.2s" begin="0s" repeatCount="indefinite" additive="sum"/></g>
          <rect x="-44" y="20" width="88" height="22" rx="6" fill="#475569"/>
          <path d="M-34 20 Q-34 -38 0 -38 Q34 -38 34 20 Z" fill="#ef4444"/>
          <path d="M-18 4 Q-18 -22 0 -24" fill="none" stroke="#fff" stroke-width="6" stroke-opacity="0.7"/>
        </g>
        <g transform="translate(1510 70)">
          <g><polygon points="0,0 360,-80 360,80" fill="#3b82f6" fill-opacity="0.28" stroke="none"/><animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1.2s" begin="0s" repeatCount="indefinite" additive="sum"/></g>
          <rect x="-44" y="20" width="88" height="22" rx="6" fill="#475569"/>
          <path d="M-34 20 Q-34 -38 0 -38 Q34 -38 34 20 Z" fill="#3b82f6"/>
          <path d="M-18 4 Q-18 -22 0 -24" fill="none" stroke="#fff" stroke-width="6" stroke-opacity="0.7"/>
        </g></g></svg>