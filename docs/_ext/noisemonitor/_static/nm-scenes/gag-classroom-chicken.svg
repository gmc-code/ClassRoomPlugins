<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000"><style>
.anim{transform-box:view-box}

    .chick{animation:chick .9s ease-in-out infinite alternate;transform-origin:1190px 1000px}
    @keyframes chick{from{transform:translateY(10px) rotate(-5deg)}to{transform:translateY(-26px) rotate(5deg)}}
    .popc{animation:popc 1.8s ease-out infinite;transform-origin:1400px 520px}
    @keyframes popc{0%,40%{transform:scale(0);opacity:0}50%{transform:scale(1.15);opacity:1}60%,85%{transform:scale(1);opacity:1}100%{transform:scale(1);opacity:0}}
    .note{animation:float 3.2s linear infinite;opacity:0}
    .n1{animation-delay:.8s}.n2{animation-delay:1.6s}.n3{animation-delay:2.4s}
    @keyframes float{0%{transform:translate(0,0) rotate(0);opacity:0}15%{opacity:1}100%{transform:translate(-230px,-380px) rotate(-25deg);opacity:0}}</style><g stroke="#1e293b" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"><g class="anim note n0"><g transform="translate(1150 560)">
    <ellipse cx="0" cy="0" rx="17" ry="13" fill="#a78bfa" transform="rotate(-20 0 0)"/>
    <line x1="14" y1="-4" x2="14" y2="-66"/>
    <path d="M14 -66 q26 10 20 34" fill="none" stroke-width="6"/></g></g><g class="anim note n1"><g transform="translate(1172 560)">
        <ellipse cx="-24" cy="0" rx="16" ry="12" fill="#38bdf8" transform="rotate(-20 -24 0)"/>
        <ellipse cx="24" cy="-10" rx="16" ry="12" fill="#38bdf8" transform="rotate(-20 24 -10)"/>
        <line x1="-10" y1="-4" x2="-10" y2="-62"/><line x1="38" y1="-14" x2="38" y2="-72"/>
        <polygon points="-10,-62 38,-72 38,-58 -10,-48" fill="#1e293b"/></g></g><g class="anim note n2"><g transform="translate(1194 560)">
    <ellipse cx="0" cy="0" rx="17" ry="13" fill="#f472b6" transform="rotate(-20 0 0)"/>
    <line x1="14" y1="-4" x2="14" y2="-66"/>
    <path d="M14 -66 q26 10 20 34" fill="none" stroke-width="6"/></g></g><g class="anim note n3"><g transform="translate(1216 560)">
        <ellipse cx="-24" cy="0" rx="16" ry="12" fill="#4ade80" transform="rotate(-20 -24 0)"/>
        <ellipse cx="24" cy="-10" rx="16" ry="12" fill="#4ade80" transform="rotate(-20 24 -10)"/>
        <line x1="-10" y1="-4" x2="-10" y2="-62"/><line x1="38" y1="-14" x2="38" y2="-72"/>
        <polygon points="-10,-62 38,-72 38,-58 -10,-48" fill="#1e293b"/></g></g>
    <g class="anim chick"><g transform="translate(1190 1040) scale(0.95)">
    <g>
      <ellipse cx="-92" cy="-70" rx="34" ry="54" fill="#fde047" transform="rotate(-20 -92 -70)"/>
      <ellipse cx="92" cy="-70" rx="34" ry="54" fill="#fde047" transform="rotate(20 92 -70)"/>
      <animateTransform attributeName="transform" type="scale" values="1 1;1.08 0.9;1 1" dur="0.3s" repeatCount="indefinite"/>
    </g>
    <ellipse cx="0" cy="-40" rx="100" ry="86" fill="#fde047"/>
    <path d="M-30 -110 Q-46 -230 -14 -310 L34 -310 Q22 -230 36 -110 Z" fill="#fde047"/>
    <path d="M-30 -112 Q0 -96 36 -112" fill="none" stroke="#fde047" stroke-width="10"/>
    <ellipse cx="10" cy="-338" rx="56" ry="48" fill="#fde047"/>
    <path d="M-30 -376 q-10 -34 16 -32 q2 -32 28 -18 q16 -26 32 4 q-34 8 -76 46 z" fill="#ef4444"/>
    <polygon points="58,-346 128,-334 58,-322" fill="#fb923c"/>
    <g>
      <polygon points="58,-320 116,-302 56,-304" fill="#f97316"/>
      <animateTransform attributeName="transform" type="rotate" values="0 58 -320;22 58 -320;0 58 -320" dur="0.45s" repeatCount="indefinite"/>
    </g>
    <path d="M54 -300 q14 32 -6 38 q-16 -8 6 -38z" fill="#ef4444"/>
    
    <circle cx="22" cy="-352" r="20" fill="#fff"/>
    <g><circle cx="22" cy="-346.0" r="9.0" fill="#1e293b" stroke="none"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;7.0 -4.0;-6.0 -7.0;0 0"
      dur="0.5s" repeatCount="indefinite"/></g>
    </g></g>
    <g class="anim popc"><g transform="translate(1400 520) rotate(8) scale(0.8)"></g></g></g></svg>