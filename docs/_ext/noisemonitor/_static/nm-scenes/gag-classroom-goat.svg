<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000"><style>
.anim{transform-box:view-box}
.goat{animation:hop 1.1s ease-in-out infinite;transform-origin:250px 805px}@keyframes hop{0%,60%,100%{transform:translateY(0)}75%{transform:translateY(-34px) rotate(-3deg)}}.popg{animation:popg 2.2s ease-out infinite 0s;transform-origin:500px 430px}@keyframes popg{0%,30%{transform:scale(0);opacity:0}40%{transform:scale(1.15);opacity:1}50%,85%{transform:scale(1);opacity:1}100%{opacity:0}}</style><g stroke="#1e293b" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <g class="anim goat"><g transform="translate(250 805) scale(0.72)">
    <!-- back legs -->
    <rect x="-118" y="-120" width="30" height="120" rx="10" fill="#e2e8f0"/>
    <rect x="-118" y="-22" width="30" height="22" rx="6" fill="#475569"/>
    <rect x="76" y="-120" width="30" height="120" rx="10" fill="#e2e8f0"/>
    <rect x="76" y="-22" width="30" height="22" rx="6" fill="#475569"/>
    <!-- tail -->
    <path d="M-150 -220 q-30 -40 -6 -60 q14 20 18 48 z" fill="#f8fafc"/>
    <!-- body -->
    <ellipse cx="0" cy="-180" rx="160" ry="86" fill="#f8fafc"/>
    <path d="M-60 -250 q40 -20 70 6 q-6 40 -50 40 q-40 -6 -20 -46z" fill="#d6a46b" stroke="none"/>
    <ellipse cx="-110" cy="-170" rx="30" ry="22" fill="#d6a46b" stroke="none"/>
    <ellipse cx="0" cy="-180" rx="160" ry="86" fill="none"/>
    <!-- front legs -->
    <rect x="-80" y="-120" width="30" height="120" rx="10" fill="#f8fafc"/>
    <rect x="-80" y="-22" width="30" height="22" rx="6" fill="#475569"/>
    <rect x="110" y="-120" width="30" height="120" rx="10" fill="#f8fafc"/>
    <rect x="110" y="-22" width="30" height="22" rx="6" fill="#475569"/>
    <!-- head + neck -->
    <g>
      <path d="M100 -220 Q140 -300 170 -330 L230 -300 Q200 -240 150 -170 Z" fill="#f8fafc"/>
      <path d="M160 -380 q-20 -60 -70 -66 q40 30 46 72 z" fill="#94a3b8"/>
      <path d="M196 -384 q-6 -66 -50 -86 q30 40 28 90 z" fill="#94a3b8"/>
      <path d="M140 -350 q-60 -6 -80 18 q50 8 86 -2 z" fill="#f8fafc"/>
      <path d="M150 -360 Q190 -400 236 -366 L290 -310 Q306 -282 280 -266 Q250 -254 226 -270 L170 -300 Q140 -320 150 -360 Z" fill="#f8fafc"/>
      <circle cx="200" cy="-344" r="16" fill="#fde68a"/>
      <rect x="190" y="-348" width="20" height="8" rx="3" fill="#1e293b" stroke="none"/>
      <path d="M186 -366 l26 6" stroke-width="4"/>
      <circle cx="280" cy="-296" r="5" fill="#1e293b" stroke="none"/>
      <path d="M236 -262 q4 40 -10 64 q-14 -24 -16 -58" fill="#e2e8f0"/>
      <!-- homework in mouth -->
      <g>
        <g transform="rotate(-14 266 -268)">
          <rect x="246" y="-284" width="120" height="80" fill="#fff"/>
          <path d="M366 -284 l-16 12 l16 10 l-14 12 l14 10 l-14 14 l14 10 l0 12" fill="none" stroke-width="4"/>
          <text x="300" y="-256" text-anchor="middle" font-family="'Arial Black','Arial Rounded MT Bold','Helvetica Neue',Arial,sans-serif" font-size="17" fill="#2563eb" stroke="none">HOME-</text>
          <text x="300" y="-234" text-anchor="middle" font-family="'Arial Black','Arial Rounded MT Bold','Helvetica Neue',Arial,sans-serif" font-size="17" fill="#2563eb" stroke="none">WORK</text>
          <text x="300" y="-213" text-anchor="middle" font-family="'Arial Black','Arial Rounded MT Bold','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#ef4444" stroke="none">A+</text>
        </g>
        <animateTransform attributeName="transform" type="translate" values="0 0;-6 6;0 0" dur="0.35s" repeatCount="indefinite"/>
      </g>
      <animateTransform attributeName="transform" type="rotate" values="-4 150 -200;4 150 -200;-4 150 -200" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" dur="0.7s" begin="0s" repeatCount="indefinite" additive="sum"/>
    </g>
    </g></g><g class="anim popg"><g transform="translate(500 430) rotate(-8) scale(0.62)"></g></g></g></svg>