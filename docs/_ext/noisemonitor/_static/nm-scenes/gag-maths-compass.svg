<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000"><style>
.anim{transform-box:view-box}
</style><g stroke="#1e293b" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <circle cx="1010" cy="300" r="70" fill="none" stroke="#e11d48" stroke-width="5" stroke-dasharray="440" stroke-dashoffset="440" transform="rotate(-90 1010 300)">
      <animate attributeName="stroke-dashoffset" values="440;0;0" keyTimes="0;0.7;1" dur="4s" repeatCount="indefinite"/></circle>
    <g>
      <g transform="translate(1010 180)">
        <line x1="0" y1="0" x2="-4" y2="120" stroke-width="8" stroke="#64748b"/>
        <line x1="0" y1="0" x2="68" y2="118" stroke-width="8" stroke="#64748b"/>
        <rect x="62" y="104" width="12" height="20" rx="3" fill="#e11d48"/>
        <circle r="12" fill="#94a3b8"/><rect x="-5" y="-34" width="10" height="24" rx="4" fill="#475569"/>
      </g>
      <animateTransform attributeName="transform" type="rotate" values="0 1010 300;360 1010 300;360 1010 300" keyTimes="0;0.7;1" dur="4s" repeatCount="indefinite"/>
    </g></g></svg>